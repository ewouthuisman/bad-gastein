name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. Ping every 3 days until the trip is over.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Stop after the trip
        id: window
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20270310 ]; then echo "active=false" >> "$GITHUB_OUTPUT"; else echo "active=true" >> "$GITHUB_OUTPUT"; fi
      - name: Query the database
        if: steps.window.outputs.active == 'true'
        run: |
          curl -sf "${{ vars.VITE_SUPABASE_URL }}/rest/v1/app_config?select=key&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" > /dev/null
          echo "Supabase pinged"
